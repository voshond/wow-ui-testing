name: Upstream

# Weekly drift check against Blizzard's Forever UI source. A newer commit on
# the pinned branch becomes a pull request: a re-pinned clientdata/forever.json,
# a new API snapshot and atlas table; the test suite reviews it.
#
# Requires the UPSTREAM_TOKEN secret: a fine-grained token for this
# repository with Contents and Pull requests read/write. Pull requests opened
# with it trigger the test suite, unlike GITHUB_TOKEN.
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream
  cancel-in-progress: false

jobs:
  client-source:
    name: Client source drift
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.UPSTREAM_TOKEN }}
      FLAVOR: forever
    steps:
      - name: Require the upstream token
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Add the UPSTREAM_TOKEN repository secret (see the workflow header)."
            exit 1
          fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          token: ${{ secrets.UPSTREAM_TOKEN }}
      - name: Compare the pin with upstream
        id: check
        run: |
          pin="clientdata/$FLAVOR.json"
          repository="$(jq -r .wowUiSource.repository "$pin")"
          branch="$(jq -r .wowUiSource.branch "$pin")"
          pinned="$(jq -r .wowUiSource.commit "$pin")"
          latest="$(git ls-remote "https://github.com/$repository.git" "refs/heads/$branch" | cut -f1)"
          if [ -z "$latest" ]; then
            echo "::error::Cannot read the $branch branch of $repository."
            exit 1
          fi
          behind=false
          [ "$pinned" = "$latest" ] || behind=true
          {
            echo "behind=$behind"
            echo "latest=$latest"
            echo "repository=$repository"
          } >> "$GITHUB_OUTPUT"
          printf '## Client source drift\n\n| Source | Pinned | Upstream | Status |\n|---|---|---|---|\n| %s (%s) | `%s` | `%s` | %s |\n' \
            "$repository" "$branch" "${pinned:0:8}" "${latest:0:8}" "$([ "$behind" = true ] && echo behind || echo current)" >> "$GITHUB_STEP_SUMMARY"
      - name: Install tools
        if: steps.check.outputs.behind == 'true'
        run: sudo apt-get update && sudo apt-get install -y luajit python3
      - name: Propose the newest client source
        if: steps.check.outputs.behind == 'true'
        env:
          LATEST: ${{ steps.check.outputs.latest }}
          REPOSITORY: ${{ steps.check.outputs.repository }}
        run: |
          old_build="$(jq -r .build "clientdata/$FLAVOR.json")"
          bash scripts/update-client-source.sh "$LATEST"
          build="$(jq -r .build "clientdata/$FLAVOR.json")"
          branch="upstream/client-source-$FLAVOR"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -c "$branch"
          git add clientdata wowmock
          git commit -q -m "Pin $FLAVOR client source to $build" \
            -m "Generated by the Upstream workflow from $REPOSITORY $LATEST."
          git push -q --force origin "$branch"
          if [ -z "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            gh pr create --base main --head "$branch" --title "Pin $FLAVOR client source to $build" --body "## Summary
          - Pins \`clientdata/$FLAVOR.json\` to $REPOSITORY \`$LATEST\` ($FLAVOR $build, was $old_build).
          - Regenerates the API snapshot and the atlas table for that build.

          Review the snapshot diff for changed or removed APIs. When the build changed, remove the old snapshot and atlas table once nothing uses them. After merging, tag a release so addons can bump \`.wut-version\`."
          fi
