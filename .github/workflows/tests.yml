name: Tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: LuaJIT test suite
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install test tools
        run: sudo apt-get update && sudo apt-get install -y luajit python3 librsvg2-bin imagemagick fonts-dejavu-core
      - name: Check out the pinned Blizzard source
        run: bash scripts/update-client-source.sh --sync
      - name: Verify the atlas table against the pinned exports
        run: |
          python3 -B scripts/atlas_catalog.py --check-pin
          python3 -B scripts/atlas_catalog.py --fetch --check
      - name: Run the library specs (the API contract regenerates the snapshot from the pinned source)
        env:
          WUT_REQUIRE_CLIENT_SOURCE: "1"
        run: luajit wowtest/cli.lua --times -j
